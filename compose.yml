volumes:
  caddy_data:
  caddy_config:
  frontend_build:

services:
  caddy:
      image: docker.io/library/caddy:2-alpine
      ports:
        - "8080:80"
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile:Z
        - caddy_data:/data
        - frontend_build:/var/www/html:ro
        - caddy_config:/config
      depends_on:
        - backend
        - frontend
  backend:
    image: docker.io/library/python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app:Z
    command: sh -c "pip install uv && uv sync && uv run fastapi run main.py"
  frontend:
    image: docker.io/oven/bun:slim
    working_dir: /app
    volumes:
      - ./frontend:/app:Z
      - frontend_build:/app/dist:Z
    command: sh -c "bun run dev --host 0.0.0.0"
